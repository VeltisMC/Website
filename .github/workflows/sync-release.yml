name: Sync release metadata

# Receives the `veltis-release` repository event from VeltisMC/Veltis after a
# successful build and release, validates the payload, and writes the channel's
# metadata into `public/releases/<channel>.json`. Vercel redeploys on the push.
#
# The build repository owns the metadata; this workflow never originates it and
# never invents a value. If the payload is malformed the job fails loudly and the
# site is left unchanged.
#
# Payload shape (a repository_dispatch allows only ten top-level `client_payload`
# properties, so the build facts and the durable location are grouped):
#
#   client_payload.metadata = the build's build-metadata.json
#     channel, version, minecraftVersion, commit, shortCommit, artifact,
#     assetName, distributionArtifact, minimumJavaVersion
#   client_payload.release = the published GitHub Release
#     downloadUrl, releaseUrl, publishedAt, size
#
# `artifact` is the human release title (`Veltis 26.3 nightly 3077e84.jar`).
# GitHub normalizes every uploaded asset name, folding the spaces to dots, so the
# stored/downloaded file is `assetName`
# (`Veltis.26.3.nightly.3077e84.jar`). Both are carried, and both are checked
# against each other and against the download URL.
on:
  repository_dispatch:
    types: [veltis-release]

# Only the repository's own contents are written, with the workflow's token.
# A push made with GITHUB_TOKEN does not re-trigger Actions, so this cannot loop.
permissions:
  contents: write

# Serialize updates so two releases cannot race to write the same channel file.
concurrency:
  group: sync-release-metadata
  cancel-in-progress: false

env:
  # The only repository a release may come from or point at.
  RELEASE_REPOSITORY: VeltisMC/Veltis

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the website
        uses: actions/checkout@v4

      - name: Validate the release payload
        id: payload
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          FILE="$RUNNER_TEMP/payload.json"
          printf '%s' "$PAYLOAD" > "$FILE"

          jq empty "$FILE" || { echo "::error::the payload is not valid JSON"; exit 1; }

          # One named boolean per invariant, so a failure names the exact field
          # rather than only saying the payload is wrong. Every fact the download
          # page renders is checked; a payload is rejected outright rather than
          # partially trusted. No secret is ever printed.
          CHECKS=$(jq -c --arg repo "$RELEASE_REPOSITORY" '
            def supported: IN("pre-alpha", "alpha", "beta", "release", "stable", "nightly");

            # GitHub replaces every run of characters outside [A-Za-z0-9_+@-] with
            # a dot, collapses runs of dots and trims the edges. This one rule is
            # shared by the Gradle build, the upload and this check.
            def githubAssetName:
              (gsub("[^A-Za-z0-9_+@-]+"; ".")
               | gsub("\\.{2,}"; ".")
               | sub("^\\.+"; "")
               | sub("\\.+$"; ""))
              | if . == "" then "veltis.jar" else . end;

            . as $p
            | $p.metadata.channel as $ch
            | $p.metadata.minecraftVersion as $mc
            | $p.metadata.shortCommit as $sha
            | ("veltis-" + ($ch | tostring) + "-" + ($mc | tostring) + "-" + ($sha | tostring)) as $tag
            | $p.metadata.artifact as $art
            | $p.metadata.assetName as $asset
            | {
                "metadata.channel":
                  ((($ch | type) == "string") and ($ch | supported)),
                "metadata.version":
                  (((($p.metadata.version | type) == "string") and (($p.metadata.version | length) > 0))),
                "metadata.minecraftVersion":
                  (((($mc | type) == "string") and (($mc | length) > 0))),
                "metadata.commit":
                  ((($p.metadata.commit | type) == "string") and ($p.metadata.commit | test("^[0-9a-f]{40}$"))),
                "metadata.shortCommit":
                  ((($sha | type) == "string") and ($sha | test("^[0-9a-f]{7}$"))),
                "metadata.shortCommit.matchesCommit":
                  (((($p.metadata.commit | type) == "string") and (($sha | type) == "string")) and ($sha == ($p.metadata.commit[0:7]))),
                "metadata.artifact":
                  ((($art | type) == "string") and ($art == ("Veltis " + ($mc // "") + " " + ($ch // "") + " " + ($sha // "") + ".jar"))),
                "metadata.assetName":
                  (((($asset | type) == "string") and (($asset | length) > 0)) and ($asset | test("^[A-Za-z0-9_+@.-]+$"))),
                "metadata.assetName.matchesArtifact":
                  ((($art | type) == "string") and ($asset == (try ($art | githubAssetName) catch ""))),
                "metadata.distributionArtifact":
                  ($p.metadata.distributionArtifact == "veltis.jar"),
                "metadata.minimumJavaVersion":
                  (($p.metadata.minimumJavaVersion == null)
                   or (try ($p.metadata.minimumJavaVersion | type == "number" and . == floor and . >= 8 and . <= 99) catch false)),
                "release.downloadUrl.isString":
                  (($p.release.downloadUrl | type) == "string"),
                "release.downloadUrl.repository":
                  (try ((($p.release.downloadUrl // "") | tostring)
                   | startswith("https://github.com/" + $repo + "/releases/download/" + $tag + "/")) catch false),
                "release.downloadUrl.asset":
                  ((try (($p.release.downloadUrl // "") | tostring | split("?")[0] | split("#")[0] | split("/") | last) catch "") == $asset),
                "release.releaseUrl":
                  ($p.release.releaseUrl == ("https://github.com/" + $repo + "/releases/tag/" + $tag)),
                "release.publishedAt":
                  (((($p.release.publishedAt | type) == "string")
                   and (try ($p.release.publishedAt | fromdateiso8601 | type == "number") catch false))),
                "release.size":
                  (($p.release.size == null)
                   or (try ($p.release.size | type == "number" and . == floor and . > 0) catch false))
              }
          ' "$FILE")

          if ! echo "$CHECKS" | jq -e 'to_entries | all(.[]; .value == true)' > /dev/null; then
            echo "::error::the release payload failed validation; the site was not updated"
            echo "--- failed checks ---"
            echo "$CHECKS" | jq -r 'to_entries[] | select(.value != true) | "  - \(.key)"'
            echo "--- received payload ---"
            cat "$FILE"
            exit 1
          fi

          {
            echo "channel=$(jq -r .metadata.channel "$FILE")"
            echo "commit=$(jq -r .metadata.commit "$FILE")"
            echo "shortCommit=$(jq -r .metadata.shortCommit "$FILE")"
            echo "artifact=$(jq -r .metadata.artifact "$FILE")"
          } >> "$GITHUB_OUTPUT"

      - name: Update the channel metadata
        env:
          CHANNEL: ${{ steps.payload.outputs.channel }}
        run: |
          set -euo pipefail
          mkdir -p public/releases
          FILE="public/releases/$CHANNEL.json"

          PREV='{"history":[]}'
          if [ -f "$FILE" ]; then PREV=$(cat "$FILE"); fi

          # Only the incoming channel's file is touched, so publishing a nightly
          # never rewrites stable history. The new build is newest; older entries
          # are kept, de-duplicated by commit (a duplicate dispatch therefore does
          # not duplicate history), sorted newest first and capped. Pruning always
          # keeps the newest entry first, so a previous valid release is never
          # dropped in favour of an older one.
          ENTRY=$(jq -c '.metadata + .release' "$RUNNER_TEMP/payload.json")
          jq -n \
            --argjson incoming "$ENTRY" \
            --argjson prev "$PREV" \
            --arg channel "$CHANNEL" \
            '{
               channel: $channel,
               latest: $incoming,
               history: (
                 [$incoming] + [($prev.latest // empty)] + ($prev.history // [])
                 | unique_by(.commit)
                 | sort_by(.publishedAt)
                 | reverse
                 | .[0:20]
               )
             }' > "$FILE.tmp"
          mv "$FILE.tmp" "$FILE"

          # Re-read what was written and confirm it still parses as expected.
          jq -e --arg channel "$CHANNEL" '
            (.channel | IN("pre-alpha", "alpha", "beta", "release", "stable", "nightly"))
            and (.channel == $channel)
            and (.latest.commit | test("^[0-9a-f]{40}$"))
            and (.latest.downloadUrl | test("^https://github.com/"))
            and (.history | length > 0)
          ' "$FILE" > /dev/null || {
            echo "::error::the written $FILE is invalid; refusing to commit"
            cat "$FILE"
            exit 1
          }

          echo "Updated $FILE"

      - name: Commit and push
        env:
          CHANNEL: ${{ steps.payload.outputs.channel }}
          SHORT: ${{ steps.payload.outputs.shortCommit }}
          ARTIFACT: ${{ steps.payload.outputs.artifact }}
        run: |
          set -euo pipefail
          git config user.name "VeltisMC Release Bot"
          git config user.email "release-bot@users.noreply.github.com"

          git add public/releases
          if git diff --cached --quiet; then
            echo "This release is already recorded; nothing to commit."
            exit 0
          fi

          git commit -m "release: $CHANNEL $SHORT ($ARTIFACT)"
          git push
